<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up, your details</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457B8}a:hover{color:#163A80}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F4F2; font-family: 'IBM Plex Sans', sans-serif; color: #1F1F1D; display: flex; flex-direction: column">
<header style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #C9C9C4; background: #FFFFFF">
<a href="Main.dc.html" style="font-weight: 600; font-size: 18px; color: #1F1F1D; text-decoration: none">Mr Rogers</a>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6B66">STEP 1 OF 3</div>
</header>
<div style="display: flex; gap: 6px; padding: 12px 20px 0">
<div style="flex: 1; height: 4px; border-radius: 2px; background: #2457B8"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #C9C9C4"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #C9C9C4"></div>
</div>
<main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px">
<h1 style="margin: 0; font-size: 26px">Your details</h1>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 600">Email</label>
<input id="email" type="email" placeholder="you@example.com" style="padding: 12px; font-size: 15px; border: 1px solid #9A9A96; border-radius: 8px; background: #FFFFFF; font-family: inherit">
<div style="font-size: 12px; color: #6B6B66">One account per email.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw" style="font-size: 14px; font-weight: 600">Password</label>
<input id="pw" type="password" style="padding: 12px; font-size: 15px; border: 1px solid #9A9A96; border-radius: 8px; background: #FFFFFF; font-family: inherit">
<div style="font-size: 12px; color: #6B6B66">At least 10 characters.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="name" style="font-size: 14px; font-weight: 600">Full name</label>
<input id="name" placeholder="Rachel Example" style="padding: 12px; font-size: 15px; border: 1px solid #9A9A96; border-radius: 8px; background: #FFFFFF; font-family: inherit">
<div style="font-size: 12px; color: #6B6B66">Hidden. Only admins see this.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="display" style="font-size: 14px; font-weight: 600">Display name</label>
<input id="display" placeholder="StormWatcher" style="padding: 12px; font-size: 15px; border: 1px solid #9A9A96; border-radius: 8px; background: #FFFFFF; font-family: inherit">
<div style="font-size: 12px; color: #6B6B66">Shown on your notes. Don't use your real name or street.</div>
<div style="font-size: 13px; color: #9B2C1F">That looks like an address. Pick something else.</div>
</div>
<div style="flex: 1"></div>
<a href="SignUp2.dc.html" style="display: block; text-align: center; padding: 14px; border-radius: 8px; background: #2457B8; color: #FFFFFF; text-decoration: none; font-weight: 600">Next: your address</a>
<div style="font-size: 14px; text-align: center">Already a member? <a href="SignIn.dc.html">Sign in</a></div>
</main>
</div>
</x-dc>

</html>
